services:
  cams_grabber_cam1:
    build: ./cams_grabber
    container_name: cams_grabber_cam1
    mem_limit: 4g
    memswap_limit: 4g
    volumes:
      - ./output:/app/output
      - ./cams_grabber/main_ssh.py:/app/main_ssh.py:cached
      - ./cams_grabber/zone_events.py:/app/zone_events.py:ro
      - ./cams_grabber/zone_config.default.json:/app/zone_config.default.json:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=0                          # x99: GPU0 — constant video processing
      - NVIDIA_DRIVER_CAPABILITIES=video,compute,utility  # 'video' injects libnvcuvid for NVDEC
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - CAMERA_ID=cam1
      - RTSP_URL=rtsp://admin:12311231aA%40@192.168.100.2:554/Streaming/Channels/101
      - OMP_NUM_THREADS=1    # PyTorch worker threads; inference is GPU-bound so 1 is sufficient
      - MKL_NUM_THREADS=1    # MKL backend thread cap (same reason)
    runtime: nvidia
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "pgrep", "-f", "main_ssh.py"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Camera 2 (192.168.100.3, вдоль стены с окнами), включена 2026-11-25. Зона — cams_grabber/zone_config.cam2.json
  # (подставляется как default и при первом запуске копируется в output/cam2/zone_config.json). RTSP_URL — в
  # cams_grabber/.env.cam2 (в git не попадает). GPU0, как и все GPU-службы x99 (решение владельца 2026-10-07).
  cams_grabber_cam2:
    build: ./cams_grabber
    container_name: cams_grabber_cam2
    mem_limit: 4g
    memswap_limit: 4g
    volumes:
      - ./output:/app/output
      - ./cams_grabber/main_ssh.py:/app/main_ssh.py:cached
      - ./cams_grabber/zone_events.py:/app/zone_events.py:ro
      - ./cams_grabber/zone_config.cam2.json:/app/zone_config.default.json:ro
    env_file:
      - ./cams_grabber/.env.cam2
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - NVIDIA_DRIVER_CAPABILITIES=video,compute,utility
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - CAMERA_ID=cam2
      - RTSP_CODEC=h265   # камера .3 отдаёт HEVC (cam1 — H.264, по умолчанию)
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
    runtime: nvidia
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "pgrep", "-f", "main_ssh.py"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Camera 3 — add RTSP_URL when camera is physically connected, then:
  #   docker compose --profile cam3 up -d cams_grabber_cam3
  cams_grabber_cam3:
    profiles: ["cam3"]
    build: ./cams_grabber
    container_name: cams_grabber_cam3
    volumes:
      - ./output:/app/output
      - ./cams_grabber/main_ssh.py:/app/main_ssh.py:cached
    environment:
      - CUDA_VISIBLE_DEVICES=1
      - CAMERA_ID=cam3
      - RTSP_URL=rtsp://user:pass@192.168.100.Y:554/Streaming/Channels/101
    runtime: nvidia
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "pgrep", "-f", "main_ssh.py"]
      interval: 30s
      timeout: 10s
      retries: 3

  tg_bot:
    build: ./tg_bot
    container_name: tg_bot
    volumes:
      - ./output:/app/output   # share output images
      - ./tg_bot/bot.py:/app/bot.py:cached  # mount local bot.py
      - ./tg_bot/nvr_clip.py:/app/nvr_clip.py:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - ./tg_bot/.env
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from pathlib import Path; raise SystemExit(0 if 'bot.py' in Path('/proc/1/cmdline').read_text(errors='ignore') else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  sys_monitor:
    build: ./sys_monitor
    container_name: sys_monitor
    volumes:
      - ./output:/app/output
      - ./cams_grabber/main_ssh.py:/app/main_ssh.py:cached
      - ./sys_monitor/ups_status.txt:/app/ups_status.txt
    env_file:
      - ./tg_bot/.env
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=utility   # only nvidia-smi needed; no compute/video
    runtime: nvidia
    restart: always
    healthcheck:
      test: ["CMD", "nvidia-smi", "-L"]
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  web_viewer:
    build: ./web_viewer
    container_name: web_viewer
    volumes:
      - ./output:/app/output:ro
    ports:
      - "18082:5000"
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/admin')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  qa_service:
    # 2026-11-26: OFF by default (owner) to save GPU0/CPU — see README "Экономия ресурсов".
    # Start manually: docker compose --profile qa up -d qa_service
    profiles: ["qa"]
    build: ./qa_service
    container_name: qa_service
    mem_limit: 1g
    memswap_limit: 1g
    volumes:
      - ./output:/app/output:ro
      - ./qa_data:/app/data
    ports:
      - "8083:5001"
    environment:
      - NVIDIA_VISIBLE_DEVICES=0   # 2026-10-07: all GPU services on GPU0 (owner); GPU1 x1-riser kept free
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
    runtime: nvidia
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
